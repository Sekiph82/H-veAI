[package]
name = "hiveai-desktop"
version = "0.1.0"
description = "H!veAI desktop shell"
authors = ["H!veAI"]
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
pty-support = ["dep:portable-pty"]

[lib]
name = "hiveai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hiveai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
uuid = { version = "1", features = ["v4"] }
notify = "8.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"

[dependencies.portable-pty]
version = "0.8.1"
optional = true

[dev-dependencies]
tempfile = "3"
